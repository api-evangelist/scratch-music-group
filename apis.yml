description: Scratch Music Group, founded in 2002, is a leading provider of DJ bookings, education, and event services. Co‑founded by Jam Master
  Jay of Run DMC, the company runs the Scratch DJ Academy offering beginner to professional curricula, both online and in‑person at locations
  in New York and Los Angeles. With over 500,000 students taught, 10,000+ DJ events annually, and a network of 7,600+ DJs, Scratch serves brand
  clients, retailers, hospitality venues, and corporate events worldwide. Their proprietary event platform powers 100,000+ events, delivering
  scalable solutions and guaranteed paid gigs for graduates. The company also offers equipment discounts and certification tracks, positioning
  itself as a comprehensive ecosystem for DJ talent and event management.

